services:
  app:
    build: .
    ports:
      - "3001:3001"
    volumes:
      - db_data:/app/backend/data
    environment:
      - PORT=3001
      - CALLBACKS_DB_PATH=/app/backend/data/callbacks.db
      - NGROK_AUTHTOKEN=${NGROK_AUTHTOKEN}
      - NGROK_DOMAIN=${NGROK_DOMAIN:-}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3001/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 3

volumes:
  db_data:
